version: "1.1.0"
description: "SUPELA v1.1.0 — Configuration Copilot App (groupnatupro/multi-branches)"

scripts:
  - name: edit
    description: "Édite, supprime, modifie et optimise le code et la documentation SUPELA"
    command: edit, remove, change, optimise
    triggers:
      - session.create
      - session.archive
  - name: validate
    description: "Lance la validation CI/CD SUPELA (19/19 RAIM, 17/17 gouvernance)"
    command: validate, verify, check
    triggers:
      - session.create
  - name: sign
    description: "Signe les artefacts Kepler via kepler_sign_artifact.py"
    command: sign, audit, trace
    triggers:
      - session.archive

automation:
  auto_issue_session: true
  remote_control: true
  default_branch: main
  require_ci_pass: true
  notify_on_failure: true