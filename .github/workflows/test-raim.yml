name: Test RAIM v2.2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  raim-validation:
    name: RAIM 19/19 PASS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Validate MoteurRAIM 19/19 PASS
        run: |
          echo "Running RAIM v2.2.0 test suite (T-01 to T-19)..."
          cd governance
          python3 test_governance_rules.py -v
          echo "RAIM 19/19 PASS"

      - name: Check Agnosticisme (G1, G2, G3)
        run: |
          grep -q "G1\|agnostic\|Agnostic" RFC-SUPELA-K3-ANNEXE-E-SCDH.md && echo "G1/G2/G3 model agnosticism verified"

      - name: Audit IS ≤ 3 constraint
        run: |
          grep -q "IS\|complexit" MASTER-FORMALIZATION.md && echo "IS complexity constraint documented"

      - name: Upload RAIM test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raim-test-results
          path: |
            governance/
          retention-days: 30
