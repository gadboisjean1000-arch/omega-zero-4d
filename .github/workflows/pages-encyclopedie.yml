name: pages-encyclopedie

# Workflow préparé pour GitHub Pages : publication manuelle uniquement
# afin de garder strictement séparés :
#   1) la trace versionnée (docs/constitution/ENCYCLOPEDIE_DICTIONNAIRE.html)
#   2) la surface de consultation (GitHub Pages après activation explicite)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-encyclopedie"
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Vérifier parité JSON -> HTML et syntaxe JS avant publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer le paquet et dépendances de vérification
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Contrôler schéma, A12, parité HTML et syntaxe JS
        run: |
          python scripts/verify_a12.py
          pytest -v tests/test_encyclopedie_dictionnaire.py tests/test_supela_laws.py
          python -c "import json, pathlib; from scripts.build_encyclopedie import load_provenance_m365_registry, validate_provenance_m365_registry, verify_html_parity, verify_html_js_syntax; d=json.loads(pathlib.Path('docs/constitution/supela-dictionnaire-encyclopedie-1.json').read_text(encoding='utf-8')); h=pathlib.Path('docs/constitution/ENCYCLOPEDIE_DICTIONNAIRE.html').read_text(encoding='utf-8'); prov=load_provenance_m365_registry(); validate_provenance_m365_registry(prov); js=verify_html_parity(d, h); syn=verify_html_js_syntax(h); assert syn['ok'], syn; print('PARITY_AND_SYNTAX_OK', len(js), len(prov['sources_onedrive_m365']))"
      - name: Préparer l'artefact statique _site pour GitHub Pages
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp docs/constitution/ENCYCLOPEDIE_DICTIONNAIRE.html _site/index.html
          cp docs/constitution/ENCYCLOPEDIE_DICTIONNAIRE.html _site/ENCYCLOPEDIE_DICTIONNAIRE.html
          cp docs/constitution/LOIS_PROUVEES_SUPELA.html _site/lois-prouvees.html
          cp docs/constitution/LOIS_PROUVEES_SUPELA.html _site/LOIS_PROUVEES_SUPELA.html
          cp docs/constitution/LOIS_PROUVEES_SUPELA.json _site/LOIS_PROUVEES_SUPELA.json
          cp docs/constitution/supela-dictionnaire-encyclopedie-1.json _site/supela-dictionnaire-encyclopedie-1.json
          cp docs/constitution/REGISTRE_CONTRADICTIONS.json _site/REGISTRE_CONTRADICTIONS.json
          cp docs/constitution/REGISTRE_PROVENANCE_M365.json _site/REGISTRE_PROVENANCE_M365.json
      - name: Upload artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Déployer la surface de consultation GitHub Pages
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
