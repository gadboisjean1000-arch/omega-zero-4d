name: vr-governance-triage

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vr-compliance-audit:
    name: Audit déterministe VR Structura Supela (VR-01..VR-20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer dépendances minimales
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Vérifier Règle A12 et VR-01..VR-20 (100%)
        run: |
          python scripts/verify_a12.py
          python scripts/vr_compliance_check.py

  triage-vr-issue:
    name: Triage automatique VR-BUG / VR-FEATURE / VR-DOCS / VR-STRUCTURE / VR-GOVERNANCE
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title || ""}\n${issue.body || ""}`.toLowerCase();
            const existing = new Set((issue.labels || []).map((l) => l.name));
            const labelsToAdd = [];

            const rules = [
              { label: "VR-BUG", re: /\b(bug|error|fail|crash|regression|exception|broken)\b/ },
              { label: "VR-FEATURE", re: /\b(feat|feature|add|implement|grpo|guard[- ]kernel|mcp)\b/ },
              { label: "VR-DOCS", re: /\b(doc|docs|readme|constitution|markdown|schema|gemini)\b/ },
              { label: "VR-STRUCTURE", re: /\b(ci|workflow|structure|a12|orphan|env|setup|bus)\b/ },
              { label: "VR-GOVERNANCE", re: /\b(vr-|cto|cta|ti|governance|opa|rego|worm|authority)\b/ }
            ];

            for (const rule of rules) {
              if (rule.re.test(text) && !existing.has(rule.label)) {
                labelsToAdd.push(rule.label);
              }
            }
            if (labelsToAdd.length === 0 && !existing.has("VR-GOVERNANCE")) {
              labelsToAdd.push("VR-GOVERNANCE");
            }
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
            }
