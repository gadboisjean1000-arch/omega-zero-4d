name: release-provenance-zenodo

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  sign-release-fulcio-rekor:
    name: Release SHA256SUMS + Sigstore Fulcio/OIDC + Rekor (Zenodo-ready)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign v3.1.4 (SHA-256 verified)
        run: |
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign
          cosign version

      - name: Build canonical Release SHA256SUMS and sign via Fulcio/OIDC + Rekor
        run: |
          sha256sum \
            CITATION.cff \
            LICENSE \
            NOTICE \
            reports/TEST-4D-ESC-01.report.json \
            docs/constitution/LOIS_PROUVEES_SUPELA.json \
            docs/constitution/LOIS_PROUVEES_SUPELA.md \
            docs/constitution/LOIS_PROUVEES_SUPELA.html \
            docs/constitution/ENCYCLOPEDIE_DICTIONNAIRE.html \
            > SHA256SUMS.txt
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

      - name: Verify Fulcio X.509 certificate SAN & Rekor transparency log entry
        run: |
          cosign verify-blob SHA256SUMS.txt \
            --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\\.com/${{ github.repository }}/\\.github/workflows/release-provenance-zenodo\\.yml@refs/tags/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Attach SHA256SUMS and Sigstore bundle to published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SHA256SUMS.txt \
            SHA256SUMS.txt.sigstore.json \
            --clobber
