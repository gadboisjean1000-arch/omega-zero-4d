name: omega-zero-4d-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-and-schemas:
    name: Python 3.11 + Draft 2020-12 + Escalade 4D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run harness twice to verify deterministic SHA-256 and report schema
        run: |
          python docs/constitution/HARNAIS_TEST_ESCALADE_4D.py --out /tmp/r1.json
          python docs/constitution/HARNAIS_TEST_ESCALADE_4D.py --out /tmp/r2.json
          python -c "import json; r1=json.load(open('/tmp/r1.json')); r2=json.load(open('/tmp/r2.json')); assert r1['protocol_sha256']==r2['protocol_sha256']; assert r1['condition_results']==r2['condition_results']"
      - name: Run pytest suite
        run: pytest -v

  opa-rego-v1:
    name: OPA Rego v1 (fmt + check --strict + 16 refutation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/opa
          opa version
      - name: Rego format check
        run: |
          out=$(opa fmt --diff policies/ tests/rego/ 2>&1) || true
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Rego strict check
        run: opa check --strict policies/ tests/rego/
      - name: Run OPA tests
        run: opa test policies/ tests/rego/ -v --explain=fails
