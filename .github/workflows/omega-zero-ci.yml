name: omega-zero-4d-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality-and-tests:
    name: Python 3.11 (ruff + mypy + A12 + Draft 2020-12 + 4D + Hypothesis + WORM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static checks (ruff + mypy + Rule A12 anti-orphans + VR-01..VR-20)
        run: |
          ruff check src/ tests/ scripts/
          mypy src/ scripts/verify_a12.py scripts/build_encyclopedie.py scripts/vr_compliance_check.py
          python scripts/verify_a12.py
          python scripts/vr_compliance_check.py
      - name: Run harness twice to verify deterministic SHA-256 and WORM idempotence
        run: |
          python docs/constitution/HARNAIS_TEST_ESCALADE_4D.py --out /tmp/r1.json
          python docs/constitution/HARNAIS_TEST_ESCALADE_4D.py --out /tmp/r2.json
          python -c "import json; r1=json.load(open('/tmp/r1.json')); r2=json.load(open('/tmp/r2.json')); assert r1['protocol_sha256']==r2['protocol_sha256']; assert r1['condition_results']==r2['condition_results']"
          make vault
      - name: Install OPA v1.22.4 (SHA-256 verified)
        run: |
          curl -fsSL -o /tmp/opa https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa && sudo mv /tmp/opa /usr/local/bin/opa
          opa version
      - name: Run pytest suite and network bus pipeline
        run: |
          pytest -v
          omega-network doctor
          omega-network pipeline

  opa-rego-v1:
    name: OPA Rego v1 (fmt + check --strict + 22 refutation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA v1.22.4 (SHA-256 verified)
        run: |
          curl -fsSL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/opa
          opa version
      - name: Rego format check
        run: |
          out=$(opa fmt --diff policies/ tests/rego/ 2>&1) || true
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Rego strict check
        run: opa check --strict policies/ tests/rego/
      - name: Run OPA tests
        run: opa test policies/ tests/rego/ -v --explain=fails

  cosign-sign-verify:
    name: Cosign v3 bundle sign & verify (mechanism proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cosign v3.1.4 (SHA-256 verified)
        run: |
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign
          cosign version
      - name: Generate throwaway keypair and sign/verify report
        run: |
          export COSIGN_PASSWORD=ci-throwaway-omega
          cosign generate-key-pair
          cosign sign-blob --key cosign.key --yes --bundle report.bundle reports/TEST-4D-ESC-01.report.json
          cosign verify-blob --key cosign.pub --bundle report.bundle reports/TEST-4D-ESC-01.report.json

  powershell-vault-idempotence:
    name: Windows PowerShell WORM vault idempotence & A12
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run PowerShell Rule A12 and Pester vault tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/verify_a12.ps1
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $r = Invoke-Pester -Path ./tests/init_omega_vault.Tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
