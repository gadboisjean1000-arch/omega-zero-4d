[project]
name = "omega-zero-4d"
version = "1.1.0"
description = "Protocole formel, schémas JSON Draft 2020-12, OPA Rego v1, WORM/Ed25519/Cosign et moteur exécutable Supela Ω-ZERO · Local–Cloud–4D"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
