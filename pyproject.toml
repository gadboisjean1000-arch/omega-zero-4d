[project]
name = "omega-zero-4d"
version = "1.1.0"
description = "Protocole formel, schémas JSON Draft 2020-12, OPA Rego v1, WORM/Ed25519/Cosign et moteur exécutable Supela Ω-ZERO · Local–Cloud–4D"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jean-François Gadbois" },
]
keywords = [
    "supela",
    "formal-verification",
    "ai-governance",
    "opa",
    "rego",
    "worm",
    "rust",
    "generic-thermodynamics",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "jsonschema>=4.23.0",
]

[project.urls]
Homepage = "https://github.com/gadboisjean1000-arch/omega-zero-4d"
Repository = "https://github.com/gadboisjean1000-arch/omega-zero-4d"
ORCID = "https://orcid.org/0009-0001-5361-6795"
CompanionMonolith = "https://github.com/gadboisjean1000-arch/Supela-K3-Omega"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
omega-zero-mcp = "omega_zero.mcp_server:main"
omega-network = "omega_zero.network_bus:main"
omega-cloudrun = "omega_zero.server:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
